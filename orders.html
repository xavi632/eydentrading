<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eyden Trading | Orders</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark">E</span>
          <span>Eyden Trading</span>
        </div>

        <nav class="menu" aria-label="Main navigation">
          <a href="index.html"><span class="icon">⌂</span>Home</a>
          <a href="create-bond.html"><span class="icon">＋</span>Create Bond</a>
          <a href="products.html"><span class="icon">▦</span>Products</a>
          <a href="customers.html"><span class="icon">◎</span>Customers</a>
          <a href="orders.html" class="active"><span class="icon">◫</span>Orders</a>
          <a href="reports.html"><span class="icon">◇</span>Reports</a>
          <a href="settings.html"><span class="icon">⚙</span>Settings</a>
        </nav>

        <div class="sidebar-footer">
          <div class="user-card">
            <div class="avatar">JT</div>
            <div>
              <strong>Jude T.</strong>
              <small>Administrator</small>
            </div>
          </div>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div class="title">Orders</div>

          <div class="toolbar">
            <div class="search">Search orders...</div>
            <button class="secondary-btn">Filter</button>
            <a href="new-order.html" class="primary-btn">+ New Order</a>
          </div>
        </header>

        <section class="grid-2" style="margin-bottom: 18px;">
          <div class="kpi-card">
            <h3>Open Orders</h3>
            <strong>146</strong>
          </div>
          <div class="kpi-card">
            <h3>Revenue</h3>
            <strong>$214k</strong>
          </div>
        </section>

        <section class="panel" id="cart-panel">
          <div class="panel-header">
            <h3>Winkelwagen</h3>
            <div>
              <button id="clear-cart" class="secondary-btn">Clear cart</button>
              <button id="confirm-order" class="primary-btn">Order Bevestigen</button>
            </div>
          </div>

          <div id="cart-contents" style="padding:16px">Loading cart…</div>

          <div style="display:flex;justify-content:flex-end;align-items:center;padding:12px 16px;border-top:1px solid #eee;">
            <strong style="margin-right:12px">Totaal:</strong>
            <div id="cart-total">Srd 0,00</div>
          </div>
        </section>

        <script src="cart.js"></script>
        <script>
          (function(){
            function fmt(n){
              return 'Srd ' + (Number(n)||0).toFixed(2).replace('.',',');
            }

            const container = document.getElementById('cart-contents');
            const totalEl = document.getElementById('cart-total');
            const clearBtn = document.getElementById('clear-cart');
            const confirmBtn = document.getElementById('confirm-order');

            function render(items){
              if(!items || items.length===0){
                container.innerHTML = '<p>Winkelwagen is leeg.</p>';
                totalEl.textContent = fmt(0);
                return;
              }

              const rows = items.map(it => {
                const line = (it.price||0) * (it.quantity||0);
                return `
                  <div class="cart-item" data-sku="${it.sku}" style="display:grid;grid-template-columns:56px 1fr 90px 110px 120px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid #f0f0f0;">
                    <img src="${it.image||''}" alt="" style="width:48px;height:48px;object-fit:cover;border-radius:6px;"/>
                    <div>
                      <div style="font-weight:600;text-transform:uppercase">${it.title}</div>
                      <div style="color:#666;font-size:12px">SKU ${it.sku}</div>
                    </div>
                    <div style="text-align:right">${fmt(it.price)}</div>
                    <div style="text-align:center">
                      <button class="dec small">−</button>
                      <span class="qty" style="display:inline-block;width:32px;text-align:center">${it.quantity}</span>
                      <button class="inc small">+</button>
                    </div>
                    <div style="text-align:right">${fmt(line)}</div>
                  </div>`;
              }).join('');

              container.innerHTML = `<div class="cart-list">${rows}</div>`;
              totalEl.textContent = fmt(window.Cart.getTotal());

              container.querySelectorAll('.cart-item').forEach(el=>{
                const sku = el.dataset.sku;
                el.querySelector('.dec').addEventListener('click', ()=>{
                  const cur = parseInt(el.querySelector('.qty').textContent,10)||0;
                  const next = Math.max(0, cur-1);
                  window.Cart.updateQuantity(sku, next);
                });
                el.querySelector('.inc').addEventListener('click', ()=>{
                  const cur = parseInt(el.querySelector('.qty').textContent,10)||0;
                  window.Cart.updateQuantity(sku, cur+1);
                });
              });
            }

            window.Cart.subscribe(items=>{
              render(items);
            });

            clearBtn.addEventListener('click', ()=>{
              if(confirm('Weet je zeker dat je de winkelwagen wilt legen?')) window.Cart.clear();
            });

            confirmBtn.addEventListener('click', ()=>{
              const items = window.Cart.getItemsArray();
              if(items.length===0){ alert('Winkelwagen is leeg'); return; }
              try{
                const draft = {};
                items.forEach(it => {
                  draft[it.sku] = { sku: it.sku, title: it.title, price: it.price, quantity: it.quantity, image: it.image };
                });
                localStorage.setItem('eyden_order_draft', JSON.stringify(draft));
              }catch(e){ console.warn('save draft failed', e); }
              // navigate to new-order page for review and final save
              window.location.href = 'new-order.html';
            });
          })();
        </script>
      </main>
    </div>
  </body>
</html>
