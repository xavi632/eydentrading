<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eyden Trading | Login</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .login-container {
        background: white;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        width: 100%;
        max-width: 420px;
        padding: 40px;
      }

      .login-header {
        text-align: center;
        margin-bottom: 40px;
      }

      .login-logo {
        font-size: 48px;
        font-weight: bold;
        margin-bottom: 12px;
      }

      .login-logo span {
        color: #0066cc;
      }

      .login-title {
        font-size: 28px;
        font-weight: 700;
        color: #1a2332;
        margin-bottom: 8px;
      }

      .login-subtitle {
        font-size: 14px;
        color: #666;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
        color: #333;
        font-size: 14px;
      }

      .form-group input {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 14px;
        font-family: inherit;
        transition: all 0.3s;
      }

      .form-group input:focus {
        outline: none;
        border-color: #0066cc;
        box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
      }

      .form-group input::placeholder {
        color: #999;
      }

      .remember-forgot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
        font-size: 13px;
      }

      .remember-forgot input[type="checkbox"] {
        margin-right: 6px;
        cursor: pointer;
      }

      .remember-forgot a {
        color: #0066cc;
        text-decoration: none;
        cursor: pointer;
      }

      .remember-forgot a:hover {
        text-decoration: underline;
      }

      .login-btn {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
      }

      .login-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
      }

      .login-btn:active {
        transform: translateY(0);
      }

      .login-footer {
        text-align: center;
        margin-top: 24px;
        font-size: 14px;
        color: #666;
      }

      .login-footer a {
        color: #0066cc;
        text-decoration: none;
      }

      .login-footer a:hover {
        text-decoration: underline;
      }

      .demo-credentials {
        background: #f0f7ff;
        border: 1px solid #cce5ff;
        border-radius: 6px;
        padding: 12px;
        margin-bottom: 20px;
        font-size: 12px;
        color: #0066cc;
      }

      .demo-credentials strong {
        display: block;
        margin-bottom: 4px;
      }

      .error-message {
        color: #dc3545;
        background: #ffe6e6;
        padding: 12px;
        border-radius: 6px;
        margin-bottom: 20px;
        font-size: 13px;
        display: none;
      }

      .success-message {
        color: #28a745;
        background: #e6f9f0;
        padding: 12px;
        border-radius: 6px;
        margin-bottom: 20px;
        font-size: 13px;
        display: none;
      }

      .loading {
        display: none;
      }

      .spinner {
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top: 2px solid white;
        width: 16px;
        height: 16px;
        animation: spin 0.6s linear infinite;
        display: inline-block;
        margin-right: 8px;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-header">
        <div class="login-logo">
          <span>E</span>T
        </div>
        <h1 class="login-title">Eyden Trading</h1>
        <p class="login-subtitle">Welcome back to your sales dashboard</p>
      </div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="error-message" id="error-message"></div>
        <div class="success-message" id="success-message"></div>

        <div class="demo-credentials">
          <strong>Credentials:</strong>
          Use your Supabase account email and password.
        </div>

        <div class="form-group">
          <label for="username">Email</label>
          <input
            type="email"
            id="username"
            placeholder="Enter your email address"
            required
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
            autocomplete="current-password"
          />
        </div>

        <div class="remember-forgot">
          <label>
            <input type="checkbox" id="remember-me" />
            Remember me
          </label>
          <a onclick="resetPassword()">Forgot password?</a>
        </div>

        <button type="submit" class="login-btn">
          <span class="loading"><div class="spinner"></div></span>
          <span class="login-text">Sign In</span>
        </button>
      </form>

      <div class="login-footer">
        Don't have an account? <a onclick="alert('Contact your administrator to create an account')">Contact support</a>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const SUPABASE_URL = 'https://egzgmtierpztzrrefeos.supabase.co';
      const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_Ln5qJKlIQQIQGxQMx6gy8w_4D70sX2i';
      const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

      function showLoginError(message) {
        const errorMsg = document.getElementById('error-message');
        errorMsg.textContent = `❌ ${message}`;
        errorMsg.style.display = 'block';
      }

      async function getProfileAndRedirect(user) {
        const { data: profile, error } = await supabaseClient
          .from('profiles')
          .select('role, status')
          .eq('id', user.id)
          .single();

        if (error || !profile) {
          await supabaseClient.auth.signOut();
          throw new Error('Your account profile could not be found. Please contact your administrator.');
        }

        const role = String(profile.role || '').trim().toLowerCase();
        const status = String(profile.status || '').trim().toLowerCase();

        if (status !== 'active') {
          await supabaseClient.auth.signOut();
          throw new Error('Your account is inactive. Please contact your administrator.');
        }

        const destination = role === 'admin' ? 'admin-dashboard.html' : role === 'worker' ? 'worker-dashboard.html' : null;
        if (!destination) {
          await supabaseClient.auth.signOut();
          throw new Error('Your account does not have permission to access this website.');
        }

        localStorage.setItem('user_session', JSON.stringify({
          id: user.id,
          authProvider: 'supabase',
          username: user.email,
          name: user.user_metadata?.name || user.email,
          role,
          type: role,
          loginTime: new Date().toISOString(),
          avatar: (user.user_metadata?.name || user.email).slice(0, 2).toUpperCase()
        }));

        return destination;
      }

      window.addEventListener('load', async () => {
        const remembered = localStorage.getItem('remember_username');
        if (remembered) {
          document.getElementById('username').value = remembered;
          document.getElementById('password').focus();
        }

        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session?.user) {
          try {
            window.location.href = await getProfileAndRedirect(session.user);
          } catch (error) {
            showLoginError(error.message);
          }
        }
      });

      async function handleLogin(e) {
        e.preventDefault();

        const email = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const rememberMe = document.getElementById('remember-me').checked;
        const errorMsg = document.getElementById('error-message');
        const successMsg = document.getElementById('success-message');
        const loginBtn = document.querySelector('.login-btn');
        const loadingSpinner = loginBtn.querySelector('.loading');

        errorMsg.style.display = 'none';
        successMsg.style.display = 'none';
        loadingSpinner.style.display = 'inline';
        loginBtn.disabled = true;

        try {
          const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) throw new Error('Incorrect email or password. Please try again.');

          const destination = await getProfileAndRedirect(data.user);
          if (rememberMe) {
            localStorage.setItem('remember_username', email);
          } else {
            localStorage.removeItem('remember_username');
          }

          successMsg.textContent = `✅ Welcome! Redirecting...`;
          successMsg.style.display = 'block';
          setTimeout(() => { window.location.href = destination; }, 800);
        } catch (error) {
          showLoginError(error.message || 'Unable to sign in. Please try again.');
          loadingSpinner.style.display = 'none';
          loginBtn.disabled = false;
        }
      }

      function resetPassword() {
        alert('Please contact your administrator to reset the password.');
      }

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          document.getElementById('login-form').requestSubmit();
        }
      });
    </script>

    <script src="auth.js"></script>
  </body>
</html>
